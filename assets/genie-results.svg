<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1545" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc"><title id="title">Historical Genie evaluation: native Chat-mode pass rates</title><desc id="desc">Three configurations, nine repeated runs and 216 question-runs. Native pass counts are 64/72, 68/72 and 71/72. Manual review of the 13 native misses found four wrong answers, five safe clarifications and four result-shape differences.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#e8f5f2"/></linearGradient><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#24445f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="1600" height="1030" fill="url(#bg)"/><circle cx="1510" cy="20" r="230" fill="#32c7a4" opacity="0.09"/><text x="80" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078a76">THE ORIGINAL PUBLISHED EXPERIMENT</text><text x="80" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#102c47">Three configurations. Nine repeated runs.</text><text x="80" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#102c47">The failures explain the score.</text><text x="80" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#55718b">24 questions × 3 runs × 3 configurations = 216 question-runs</text><rect x="70" y="280" width="1460" height="440" rx="22" fill="#ffffff" stroke="#c6d8e7" filter="url(#shadow)"/><text x="110" y="327" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#12314f">Native Chat-mode pass rate</text><text x="520.0" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#55718b">0%</text><path d="M520.0 380 V670" stroke="#dbe7ed" stroke-width="1.5"/><text x="870.0" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#55718b">50%</text><path d="M870.0 380 V670" stroke="#dbe7ed" stroke-width="1.5"/><text x="1220.0" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#55718b">100%</text><path d="M1220.0 380 V670" stroke="#dbe7ed" stroke-width="1.5"/><text x="110" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#12314f">Raw tables</text><text x="110" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#55718b">Baseline</text><rect x="520" y="396" width="700" height="39" rx="12" fill="#edf3f7" stroke="#edf3f7" /><rect x="520" y="396" width="622.222222" height="39" rx="12" fill="#377bb5" stroke="#377bb5" data-condition="baseline" data-passed="64" data-total="72"/><text x="520" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#55718b">Runs: 20/24 · 22/24 · 22/24</text><text x="1415" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="end" fill="#377bb5">88.9%</text><text x="1415" y="469" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="end" fill="#12314f">64 / 72</text><text x="110" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#12314f">Governed metric view</text><text x="110" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#55718b">Shared metric definitions</text><rect x="520" y="498" width="700" height="39" rx="12" fill="#edf3f7" stroke="#edf3f7" /><rect x="520" y="498" width="661.111111" height="39" rx="12" fill="#174c68" stroke="#174c68" data-condition="treatment" data-passed="68" data-total="72"/><text x="520" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#55718b">Runs: 23/24 · 23/24 · 22/24</text><text x="1415" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="end" fill="#174c68">94.4%</text><text x="1415" y="571" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="end" fill="#12314f">68 / 72</text><text x="110" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#12314f">Property-grain metadata</text><text x="110" y="662" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#55718b">Metric view + metadata fix</text><rect x="520" y="600" width="700" height="39" rx="12" fill="#edf3f7" stroke="#edf3f7" /><rect x="520" y="600" width="690.277778" height="39" rx="12" fill="#079b85" stroke="#079b85" data-condition="treatment-optimized" data-passed="71" data-total="72"/><text x="520" y="674" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#55718b">Runs: 24/24 · 23/24 · 24/24</text><text x="1415" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="end" fill="#079b85">98.6%</text><text x="1415" y="673" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="end" fill="#12314f">71 / 72</text><text x="80" y="777" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#102c47">13 native misses: what manual review found</text><rect x="70" y="806" width="470" height="112" rx="20" fill="#fff2ec" stroke="#c6d8e7" /><text x="105" y="879" font-family="Segoe UI, Arial, sans-serif" font-size="53" font-weight="700" text-anchor="start" fill="#b64c38">4</text><text x="166" y="874" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#12314f">Wrong answers</text><rect x="565" y="806" width="470" height="112" rx="20" fill="#e9f8f4" stroke="#c6d8e7" /><text x="600" y="879" font-family="Segoe UI, Arial, sans-serif" font-size="53" font-weight="700" text-anchor="start" fill="#078a76">5</text><text x="661" y="874" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#12314f">Safe clarifications</text><rect x="1060" y="806" width="470" height="112" rx="20" fill="#e9f3fd" stroke="#c6d8e7" /><text x="1095" y="879" font-family="Segoe UI, Arial, sans-serif" font-size="53" font-weight="700" text-anchor="start" fill="#24669e">4</text><text x="1156" y="874" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#12314f">Result-shape differences</text><text x="80" y="964" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#55718b">203 native passes received limited automated SQL checks.</text><text x="80" y="1003" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#55718b">One fixed workload. These results do not guarantee general accuracy.</text></svg>