<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Genie Truth Lab evaluation method</title>
  <desc id="desc">A reproducible flow from built-in Wanderbricks data through checked SQL, development and reserved prompts, three repeated runs, failure review, and a metadata-only fix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#e8f5f2"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2d4e"/>
      <stop offset="1" stop-color="#174c68"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04a98c"/>
      <stop offset="1" stop-color="#48d3ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#24445f" flood-opacity="0.17"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b6d87"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="60" r="220" fill="#32c7a4" opacity="0.12"/>
  <circle cx="90" cy="850" r="260" fill="#4b91df" opacity="0.10"/>

  <text x="90" y="90" fill="#078a76" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750" letter-spacing="3">A REPRODUCIBLE ACCURACY LOOP</text>
  <text x="90" y="152" fill="#102c47" font-family="Inter, Arial, sans-serif" font-size="47" font-weight="800">Do not ask whether an Agent is accurate.</text>
  <text x="90" y="207" fill="#102c47" font-family="Inter, Arial, sans-serif" font-size="47" font-weight="800">Ask whether it passes a declared workload.</text>

  <g font-family="Inter, Arial, sans-serif">
    <path d="M 340 390 L 430 390" stroke="#4b6d87" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M 740 390 L 830 390" stroke="#4b6d87" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M 1140 390 L 1230 390" stroke="#4b6d87" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(70 285)" filter="url(#shadow)">
      <rect width="270" height="210" rx="26" fill="#ffffff" stroke="#c6d8e7"/>
      <circle cx="52" cy="52" r="26" fill="#e8f2fb"/>
      <text x="52" y="60" text-anchor="middle" fill="#24669e" font-size="23" font-weight="800">1</text>
      <text x="30" y="110" fill="#12314f" font-size="24" font-weight="800">Built-in data</text>
      <text x="30" y="144" fill="#55718b" font-size="18">Wanderbricks</text>
      <text x="30" y="174" fill="#55718b" font-size="18">Zero downloads</text>
    </g>

    <g transform="translate(430 285)" filter="url(#shadow)">
      <rect width="310" height="210" rx="26" fill="#ffffff" stroke="#c6d8e7"/>
      <circle cx="52" cy="52" r="26" fill="#e8f2fb"/>
      <text x="52" y="60" text-anchor="middle" fill="#24669e" font-size="23" font-weight="800">2</text>
      <text x="30" y="110" fill="#12314f" font-size="24" font-weight="800">Checked workload</text>
      <text x="30" y="144" fill="#55718b" font-size="18">24 prompts</text>
      <text x="30" y="174" fill="#55718b" font-size="18">Six gold SQL answers</text>
    </g>

    <g transform="translate(830 285)" filter="url(#shadow)">
      <rect width="310" height="210" rx="26" fill="url(#navy)"/>
      <circle cx="52" cy="52" r="26" fill="#ffffff" opacity="0.16"/>
      <text x="52" y="60" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="800">3</text>
      <text x="30" y="110" fill="#ffffff" font-size="24" font-weight="800">Repeated evaluation</text>
      <text x="30" y="144" fill="#bad1e5" font-size="18">Three fresh runs</text>
      <text x="30" y="174" fill="#bad1e5" font-size="18">Native score + failure review</text>
    </g>

    <g transform="translate(1230 285)" filter="url(#shadow)">
      <rect width="300" height="210" rx="26" fill="url(#teal)"/>
      <circle cx="52" cy="52" r="26" fill="#ffffff" opacity="0.25"/>
      <text x="52" y="60" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="800">4</text>
      <text x="30" y="110" fill="#073e38" font-size="24" font-weight="850">Fix and retest</text>
      <text x="30" y="144" fill="#084f47" font-size="18">Metric View</text>
      <text x="30" y="174" fill="#084f47" font-size="18">Then property ID metadata</text>
    </g>
  </g>

  <g transform="translate(90 565)" font-family="Inter, Arial, sans-serif">
    <rect width="1420" height="230" rx="30" fill="#ffffff" stroke="#c6d8e7" filter="url(#shadow)"/>
    <text x="40" y="55" fill="#12314f" font-size="22" font-weight="800">How the 24 prompts are used</text>

    <rect x="40" y="85" width="420" height="105" rx="18" fill="#e9f3fd"/>
    <text x="68" y="125" fill="#1d6098" font-size="20" font-weight="800">12 development prompts</text>
    <text x="68" y="158" fill="#4e708c" font-size="17">Find failures and choose the metadata fix</text>

    <rect x="500" y="85" width="420" height="105" rx="18" fill="#e9f8f4"/>
    <text x="528" y="125" fill="#078a76" font-size="20" font-weight="800">12 reserved paraphrases</text>
    <text x="528" y="158" fill="#4e708c" font-size="17">Known intents with frozen wording</text>

    <rect x="960" y="85" width="420" height="105" rx="18" fill="#fff2ec"/>
    <text x="988" y="125" fill="#b64c38" font-size="20" font-weight="800">Four control families</text>
    <text x="988" y="158" fill="#745f59" font-size="17">Detect regressions outside the changed metric</text>
  </g>

  <text x="800" y="852" text-anchor="middle" fill="#527089" font-family="Inter, Arial, sans-serif" font-size="18">Exact prompts, checked SQL, configs, run evidence, and review ledger are versioned together.</text>
</svg>
